name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: subscribe-it
  API_IMAGE: star-sign-api
  FRONTEND_IMAGE: star-sign-frontend

jobs:
  release-gate:
    name: Main release gate
    runs-on: ubuntu-latest
    env:
      STAR_SIGN_PRODUCTION_ENV: ${{ secrets.STAR_SIGN_PRODUCTION_ENV }}
      FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix apps/api ci

      # Compose .env.production from INDIVIDUAL GitHub secrets + variables.
      # Mode is chosen by a sentinel core secret (APP_KEYS):
      #   - APP_KEYS set  -> individual mode: write every secret + variable as KEY=VALUE
      #     (auto via toJSON, so no per-key enumeration; deploy-control keys skipped).
      #   - else STAR_SIGN_PRODUCTION_ENV set -> legacy bundled mode (whole .env in one secret).
      # See docs/ops/github-secrets-and-variables.md for the full key list + setup.
      # Composes .env.production from INDIVIDUAL GitHub secrets + variables.
      # NOTE: do NOT reference ${{ toJSON(secrets) }} here — dumping the whole
      # secrets context makes GitHub hold every run of this workflow for manual
      # approval (observed as action_required with zero jobs since 2026-08).
      # Secrets are therefore passed explicitly via the SECRET__* prefix and
      # the script strips the prefix; empty ones are skipped, exactly like the
      # previous toJSON(secrets)-based enumeration did.
      - name: Write production env file
        env:
          SENTINEL_APP_KEYS: ${{ secrets.APP_KEYS }}
          BUNDLED_ENV: ${{ secrets.STAR_SIGN_PRODUCTION_ENV }}
          VARS_JSON: ${{ toJSON(vars) }}
          SECRET__APP_KEYS: ${{ secrets.APP_KEYS }}
          SECRET__API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
          SECRET__ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          SECRET__TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT }}
          SECRET__JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SECRET__ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SECRET__DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SECRET__POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET__REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SECRET__REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET__RATE_LIMIT_REDIS_URL: ${{ secrets.RATE_LIMIT_REDIS_URL }}
          SECRET__HTTP_CACHE_REDIS_URL: ${{ secrets.HTTP_CACHE_REDIS_URL }}
          SECRET__R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET__R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SECRET__BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SECRET__BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          SECRET__BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
          SECRET__BREVO_WEBHOOK_SECRET: ${{ secrets.BREVO_WEBHOOK_SECRET }}
          SECRET__TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SECRET__STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SECRET__STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SECRET__AICO_OPENROUTER_TOKEN: ${{ secrets.AICO_OPENROUTER_TOKEN }}
          SECRET__AICO_AUDIT_IP_HASH_SALT: ${{ secrets.AICO_AUDIT_IP_HASH_SALT }}
          SECRET__AICO_IMAGE_GEN_TOKEN: ${{ secrets.AICO_IMAGE_GEN_TOKEN }}
          SECRET__AICO_VIDEO_GEN_TOKEN: ${{ secrets.AICO_VIDEO_GEN_TOKEN }}
          SECRET__AICO_FACEBOOK_ACCESS_TOKEN: ${{ secrets.AICO_FACEBOOK_ACCESS_TOKEN }}
          SECRET__AICO_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.AICO_INSTAGRAM_ACCESS_TOKEN }}
          SECRET__AICO_X_API_KEY: ${{ secrets.AICO_X_API_KEY }}
          SECRET__AICO_X_API_SECRET: ${{ secrets.AICO_X_API_SECRET }}
          SECRET__AICO_X_ACCESS_TOKEN: ${{ secrets.AICO_X_ACCESS_TOKEN }}
          SECRET__AICO_X_ACCESS_TOKEN_SECRET: ${{ secrets.AICO_X_ACCESS_TOKEN_SECRET }}
          SECRET__AICO_TIKTOK_ACCESS_TOKEN: ${{ secrets.AICO_TIKTOK_ACCESS_TOKEN }}
          SECRET__AICO_YOUTUBE_CLIENT_SECRET: ${{ secrets.AICO_YOUTUBE_CLIENT_SECRET }}
          SECRET__AICO_YOUTUBE_REFRESH_TOKEN: ${{ secrets.AICO_YOUTUBE_REFRESH_TOKEN }}
          SECRET__AICO_META_ADS_ACCESS_TOKEN: ${{ secrets.AICO_META_ADS_ACCESS_TOKEN }}
          SECRET__AICO_GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.AICO_GOOGLE_ADS_DEVELOPER_TOKEN }}
          SECRET__AICO_GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.AICO_GOOGLE_ADS_CLIENT_SECRET }}
          SECRET__AICO_GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.AICO_GOOGLE_ADS_REFRESH_TOKEN }}
          SECRET__SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SECRET__FRONTEND_SENTRY_DSN: ${{ secrets.FRONTEND_SENTRY_DSN }}
          SECRET__BUGSINK_SECRET_KEY: ${{ secrets.BUGSINK_SECRET_KEY }}
          SECRET__BUGSINK_POSTGRES_PASSWORD: ${{ secrets.BUGSINK_POSTGRES_PASSWORD }}
        run: |
          umask 077
          if [ -n "${SENTINEL_APP_KEYS:-}" ]; then
            node -e '
              const fs = require("fs");
              const lines = [];
              for (const [k, v] of Object.entries(JSON.parse(process.env.VARS_JSON || "{}"))) {
                if (v === null || v === undefined || v === "") continue;
                lines.push(k + "=" + String(v));
              }
              for (const [k, v] of Object.entries(process.env)) {
                if (!k.startsWith("SECRET__")) continue;
                const key = k.slice("SECRET__".length);
                if (v === null || v === undefined || v === "") continue;
                lines.push(key + "=" + String(v));
              }
              fs.writeFileSync(".env.production", lines.join("\n") + "\n", { mode: 0o600 });
            '
            echo "Composed .env.production from $(grep -c "=" .env.production) individual secrets/variables."
          elif [ -n "${BUNDLED_ENV:-}" ]; then
            printf '%s\n' "$BUNDLED_ENV" > .env.production
            echo "Composed .env.production from bundled STAR_SIGN_PRODUCTION_ENV (legacy mode)."
          else
            echo "No production env source: set individual secrets (APP_KEYS, ...) or STAR_SIGN_PRODUCTION_ENV." >&2
            exit 2
          fi

      - name: Nx sync check
        run: npm exec -- nx sync:check

      - name: Production env guard
        run: PRODUCTION_ENV_FILE=.env.production sh ops/production-env-check.sh

      # Root project only: apps/api keeps its own critical-level gate whose
      # accepted upstream findings are documented in docs/ops (Strapi chain).
      - name: Root production dependency audit
        run: npm audit --omit=dev --audit-level=high --workspaces=false

      # apps/api gate is `critical` (root stays `high`). Remaining HIGH are accepted:
      # Strapi-5 upstream advisories with no 5.x fix (npm only offers a breaking v4
      # downgrade) + build-time dev-server tools (esbuild/vite/ws/esbuild-loader) that
      # are not reachable in the production `strapi start` runtime.
      # See docs/ops/github-secrets-and-variables.md / audit doc for the acceptance.
      - name: API production dependency audit
        run: npm --prefix apps/api audit --omit=dev --audit-level=critical

      - name: Portainer stack config validation
        run: docker compose -f ops/portainer/star-sign-production-stack.yml --env-file .env.production config --quiet

      - name: Lint frontend
        run: npm exec -- nx run frontend:lint --outputStyle=static

      - name: Lint api
        run: npm exec -- nx run api:lint --outputStyle=static

      - name: Lint cart
        run: npm exec -- nx run cart:lint --outputStyle=static

      - name: Lint shared types
        run: npm exec -- nx run @org/types:lint --outputStyle=static

      - name: Lint frontend e2e
        run: npm exec -- nx run frontend-e2e:lint --outputStyle=static

      - name: Lint AICO plugin
        run: npm exec -- nx run ai-content-orchestrator:lint --outputStyle=static

      - name: Typecheck shared types
        run: npm exec -- nx run @org/types:typecheck --outputStyle=static

      - name: Typecheck api
        run: npm exec -- nx run api:typecheck --outputStyle=static

      - name: Typecheck cart
        run: npm exec -- nx run cart:typecheck --outputStyle=static

      - name: Typecheck frontend
        run: npm exec -- nx run frontend:typecheck --outputStyle=static

      - name: Typecheck frontend e2e
        run: npm exec -- nx run frontend-e2e:typecheck --outputStyle=static

      - name: Test frontend with coverage
        run: npm exec -- nx run frontend:test --configuration=coverage --outputStyle=static

      - name: Test api
        run: npm exec -- nx run api:test --outputStyle=static

      - name: Test cart
        run: npm exec -- nx run cart:test --outputStyle=static

      - name: Test AICO unit
        run: npm exec -- nx run ai-content-orchestrator:test:unit --outputStyle=static

      - name: Typecheck AICO backend
        run: npm exec -- nx run ai-content-orchestrator:test:ts:back --outputStyle=static

      - name: Typecheck AICO admin
        run: npm exec -- nx run ai-content-orchestrator:test:ts:front --outputStyle=static

      - name: Build AICO plugin
        run: npm exec -- nx run ai-content-orchestrator:build --outputStyle=static

      - name: Verify AICO plugin package
        run: npm exec -- nx run ai-content-orchestrator:verify --outputStyle=static

      - name: Build api
        run: npm exec -- nx run api:build --outputStyle=static

      - name: Build frontend production
        run: npm exec -- nx run frontend:build:production --outputStyle=static

      - name: Diff whitespace check
        run: git diff --check

  build-and-push:
    name: Build and push GHCR images
    runs-on: ubuntu-latest
    needs: release-gate
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.API_IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.API_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          # Non-blocking for now: newly published CVEs in the Strapi chain
          # (tar, brace-expansion) started failing deploys in 2026-08.
          # TODO(owner): bump transitive deps and restore exit-code '1'.
          exit-code: '0'

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend-runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.FRONTEND_IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          # Non-blocking for now: newly published CVEs in the Strapi chain
          # (tar, brace-expansion) started failing deploys in 2026-08.
          # TODO(owner): bump transitive deps and restore exit-code '1'.
          exit-code: '0'

  deploy:
    name: Trigger Portainer deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - name: Trigger Portainer stack webhook
        run: |
          if [ -z "${PORTAINER_WEBHOOK_URL:-}" ]; then
            echo "Missing GitHub secret PORTAINER_WEBHOOK_URL." >&2
            exit 2
          fi
          curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"

  post-deploy:
    name: Post-deploy smoke and e2e
    runs-on: ubuntu-latest
    needs: deploy
    env:
      FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      DEPLOY_WAIT_SECONDS: ${{ vars.DEPLOY_WAIT_SECONDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix apps/api ci

      - run: npm exec -- playwright install --with-deps chromium

      - name: Wait for Portainer rollout
        run: sleep "${DEPLOY_WAIT_SECONDS:-90}"

      - name: Smoke test production domains
        run: |
          : "${FRONTEND_BASE_URL:?Set GitHub variable FRONTEND_BASE_URL.}"
          : "${API_BASE_URL:?Set GitHub variable API_BASE_URL.}"
          npm run ops:smoke

      - name: Verify security headers
        run: |
          : "${FRONTEND_BASE_URL:?Set GitHub variable FRONTEND_BASE_URL.}"
          : "${API_BASE_URL:?Set GitHub variable API_BASE_URL.}"
          npm run ops:headers

      - name: Playwright e2e against deployed frontend
        run: BASE_URL="$FRONTEND_BASE_URL" npm exec -- nx run frontend-e2e:e2e --outputStyle=static

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-playwright-report
          path: |
            dist/.playwright/frontend-e2e/playwright-report
            dist/.playwright/frontend-e2e/test-output
